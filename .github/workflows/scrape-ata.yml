name: Scrape ATA

on:
  schedule:
    - cron: "7 14 * * *" # daily, ~7:07am Pacific (staggered after the others)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run scrape -- ata

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- movie-data; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add movie-data
          git commit -m "Update ATA showtimes"
          git push
