name: Scrape Vogue

on:
  schedule:
    - cron: "27 13 * * *" # daily, ~6:27am Pacific (staggered after Balboa)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run scrape -- vogue

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- movie-data; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add movie-data
          git commit -m "Update Vogue showtimes"
          git push
